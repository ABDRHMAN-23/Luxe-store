<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--bg-primary:#080808;--bg-secondary:#0F0F0F;--bg-tertiary:#141414;--accent:#C9A84C;--accent-light:#E0C872;--text-primary:#F7F3EC;--text-secondary:#B5AA9A;--text-muted:#5E564B;--border:rgba(201,168,76,0.12)}
    [data-theme="light"]{--bg-primary:#FAFAF8;--bg-secondary:#F0EDE8;--bg-tertiary:#E8E4DF;--text-primary:#1A1A1A;--text-secondary:#4A4540;--text-muted:#8A8078;--border:rgba(201,168,76,0.2)}
    [data-theme="sepia"]{--bg-primary:#1C1810;--bg-secondary:#241F15;--bg-tertiary:#2A2418;--text-primary:#E8DCC8;--text-secondary:#B8A88A;--text-muted:#6A5D4A;--border:rgba(201,168,76,0.15)}
    *{box-sizing:border-box}
    body{font-family:'Libre Franklin',sans-serif;font-weight:300;background:var(--bg-primary);color:var(--text-primary);transition:background 0.6s,color 0.6s}
    .font-display{font-family:'Playfair Display',serif}
    .hide-scrollbar::-webkit-scrollbar{display:none}.hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .marquee-track{animation:marquee 30s linear infinite}
    @keyframes float-up{0%{transform:translateY(0) scale(1);opacity:0.6}100%{transform:translateY(-60px) scale(0.4);opacity:0}}
    .sr{opacity:0;transform:translateY(80px);transition:opacity 1.2s cubic-bezier(0.25,1,0.5,1),transform 1.2s cubic-bezier(0.25,1,0.5,1)}
    .sr.vis{opacity:1;transform:translateY(0)}
    @keyframes hero-in{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
    .hero-stagger{opacity:0;animation:hero-in 1.4s cubic-bezier(0.25,1,0.5,1) forwards}
    .nav-solid{background:var(--bg-primary);border-bottom:1px solid var(--border)}
    .img-zoom{transition:transform 5s cubic-bezier(0.25,1,0.5,1)}.img-zoom:hover{transform:scale(1.05)}
    .product-card{transition:transform 0.5s cubic-bezier(0.25,1,0.5,1)}.product-card:hover{transform:translateY(-4px)}
    .product-card:hover .p-actions{opacity:1;transform:translateY(0)}
    .p-actions{opacity:0;transform:translateY(8px);transition:all 0.4s cubic-bezier(0.25,1,0.5,1)}
    @media(max-width:768px){.p-actions{opacity:1;transform:translateY(0)}}
    .product-img-wrap{border:1px solid var(--border);transition:box-shadow 0.4s}
    .product-card:hover .product-img-wrap{box-shadow:0 0 40px rgba(201,168,76,0.06)}
    .gold-border{border:1px solid var(--border);transition:border-color 0.3s}.gold-border:hover,.gold-border:focus{border-color:rgba(201,168,76,0.5)}
    .drawer-overlay{transition:opacity 0.4s}.drawer-panel{transition:transform 0.5s cubic-bezier(0.25,1,0.5,1)}
    .section-div{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.2}
    .gold-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .gold-particle{position:absolute;width:2px;height:2px;background:var(--accent);border-radius:50%;animation:float-up 3s ease-in infinite;opacity:0}
    .notif-bar{transition:transform 0.4s,opacity 0.4s}.notif-bar.hidden-bar{transform:translateY(-100%);opacity:0;pointer-events:none}
    .admin-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg-primary);overflow-y:auto;display:none}
    .admin-overlay.open{display:block}
    .admin-input{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:10px 14px;font-size:13px;width:100%;outline:none;border-radius:4px}
    .admin-input:focus{border-color:var(--accent)}
    .admin-btn{background:var(--accent);color:#080808;padding:10px 18px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;cursor:pointer;border:none;border-radius:4px}
    .admin-btn-danger{background:#dc2626;color:#fff}
    .admin-btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-primary)}
    .admin-tab{padding:10px 18px;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-secondary);white-space:nowrap}
    .admin-tab.active{color:var(--accent);border-color:var(--accent)}
    .admin-table{width:100%;border-collapse:collapse;font-size:12px}
    .admin-table th,.admin-table td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--border)}
    .admin-table th{color:var(--accent);font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase}
    @media(prefers-reduced-motion:reduce){.sr{opacity:1;transform:none;transition:none}.hero-stagger{opacity:1;animation:none}.marquee-track{animation:none}.img-zoom{transition:none}.img-zoom:hover{transform:none}.gold-particle{display:none}}
  </style>
 </head>
 <body class="w-full min-h-screen">

  <!-- NOTIFICATION BAR -->
  <div id="notif-bar" class="notif-bar w-full py-2 px-4 text-center relative z-[60]" style="background:var(--accent);">
   <p id="notif-text" class="text-[10px] tracking-[0.3em] uppercase font-medium" style="color:#080808;"></p>
   <button id="notif-close" class="absolute end-4 top-1/2 -translate-y-1/2" aria-label="Close notification"><i data-lucide="x" class="w-3.5 h-3.5" style="color:#080808;"></i></button>
  </div>

  <!-- NAV -->
  <nav id="main-nav" class="fixed top-0 inset-x-0 z-50 transition-all duration-500" style="top:32px;">
   <div class="max-w-[1440px] mx-auto px-4 md:px-10">
    <div class="flex items-center justify-between py-5 md:py-6">
     <div class="flex items-center gap-3">
      <button id="theme-btn" class="p-1.5" aria-label="Theme"><i data-lucide="moon" class="w-5 h-5" style="color:var(--text-primary);"></i></button>
      <button id="cart-btn" aria-label="Cart" class="relative p-1.5"><i data-lucide="shopping-bag" class="w-5 h-5" style="color:var(--text-primary);"></i><span id="cart-count" class="absolute -top-1 -right-1 w-4 h-4 rounded-full text-[9px] flex items-center justify-center hidden" style="background:var(--accent);color:#080808;"></span></button>
      <button id="fav-btn" aria-label="Favorites" class="relative p-1.5"><i data-lucide="heart" class="w-5 h-5" style="color:var(--text-primary);"></i><span id="fav-count" class="absolute -top-1 -right-1 w-4 h-4 rounded-full text-[9px] flex items-center justify-center hidden" style="background:var(--accent);color:#080808;"></span></button>
      <button id="search-btn" class="p-1.5" aria-label="Search"><i data-lucide="search" class="w-5 h-5" style="color:var(--text-primary);"></i></button>
     </div>
     <a href="#" id="nav-brand" class="font-display text-2xl md:text-3xl tracking-[0.5em] uppercase">LUXE</a>
     <div class="flex items-center gap-3">
      <button id="lang-btn" class="text-[9px] tracking-[0.2em] uppercase px-2 py-1 gold-border" style="color:var(--accent);">EN</button>
      <button id="mobile-menu-btn" class="md:hidden p-2.5" aria-label="Menu"><i data-lucide="menu" class="w-6 h-6" style="color:var(--text-primary);"></i></button>
     </div>
    </div>
    <div id="cat-nav" class="hidden md:flex items-center justify-center gap-10 pb-4 pt-2 border-t" style="border-color:var(--border);"></div>
   </div>
  </nav>

  <!-- MOBILE MENU DRAWER -->
  <div id="mobile-menu-drawer" class="fixed inset-0 z-[110] pointer-events-none hidden">
   <div id="mobile-menu-overlay" class="absolute inset-0 bg-black/70 opacity-0 drawer-overlay pointer-events-auto"></div>
   <div id="mobile-menu-panel" class="absolute top-0 start-0 h-full w-full max-w-xs pointer-events-auto drawer-panel flex flex-col p-6" style="background:var(--bg-primary);transform:translateX(-100%);border-inline-end:1px solid var(--border);">
    <div class="flex items-center justify-between pb-6 mb-6 border-b" style="border-color:var(--border);">
     <span class="font-display text-lg tracking-[0.3em] uppercase" id="mobile-menu-brand">LUXE</span>
     <button id="mobile-menu-close" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="mobile-menu-links" class="flex flex-col gap-6 text-sm tracking-widest uppercase"></div>
    <div class="mt-auto pt-6 border-t" style="border-color:var(--border);">
     <button onclick="openAdminPanel(); toggleMobileMenu();" class="w-full py-3 text-[10px] tracking-[0.2em] uppercase gold-border font-medium">لوحة التحكم / Admin</button>
    </div>
   </div>
  </div>

  <!-- HERO -->
  <section class="relative w-full overflow-hidden" style="height:calc(100 * min(var(--vh,1vh),1vh));">
   <div class="absolute inset-0"><img id="hero-img" class="w-full h-[120%] object-cover" src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=1600" alt="Hero"></div>
   <div class="absolute inset-0" style="background:linear-gradient(to top, var(--bg-primary) 0%, rgba(8,8,8,0.3) 40%, rgba(8,8,8,0.5) 100%);"></div>
   <div class="relative z-10 flex flex-col justify-end h-full pb-24 md:pb-36 px-6 md:px-16 max-w-[1440px] mx-auto">
    <p id="hero-eyebrow" class="hero-stagger text-[9px] tracking-[0.6em] uppercase mb-4 text-[#C9A84C]" style="animation-delay:0.3s;"></p>
    <h1 id="hero-title" class="font-display hero-stagger text-5xl md:text-8xl leading-[1.05] mb-3" style="animation-delay:0.5s;"></h1>
    <div class="w-16 h-[1px] mb-6 hero-stagger" style="background:var(--accent);animation-delay:0.7s;"></div>
    <p id="hero-subtitle" class="hero-stagger text-sm max-w-lg mb-10" style="animation-delay:0.7s;line-height:1.9;"></p>
    <div class="flex gap-3 flex-wrap hero-stagger" style="animation-delay:0.9s;">
     <button id="hero-cta" class="px-10 py-3.5 text-[9px] tracking-[0.3em] uppercase font-medium bg-[#C9A84C] text-[#080808] transition-all hover:opacity-90"></button>
     <button id="hero-cta2" class="px-10 py-3.5 text-[9px] tracking-[0.3em] uppercase font-medium gold-border transition-all"></button>
    </div>
   </div>
  </section>

  <!-- MARQUEE -->
  <div class="w-full py-4 overflow-hidden" style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
   <div class="marquee-track whitespace-nowrap flex w-max" style="direction:ltr;">
    <span id="marquee-text" class="inline-block flex-shrink-0 whitespace-nowrap text-[9px] tracking-[0.5em] uppercase px-8"></span>
    <span id="marquee-text-dup" class="inline-block flex-shrink-0 whitespace-nowrap text-[9px] tracking-[0.5em] uppercase px-8" style="color:var(--text-muted);"></span>
   </div>
  </div>

  <!-- CATEGORIES -->
  <section class="py-12 md:py-16 sr">
   <div class="px-6 md:px-16 max-w-[1440px] mx-auto mb-10">
    <p id="cat-eyebrow" class="text-[9px] tracking-[0.5em] uppercase mb-2 text-[#C9A84C]"></p>
    <h2 id="cat-heading" class="font-display text-3xl md:text-5xl"></h2>
   </div>
   <div id="cat-rail" class="flex gap-6 px-6 md:px-16 overflow-x-auto hide-scrollbar cursor-grab"></div>
  </section>
  <div class="section-div max-w-[1440px] mx-auto"></div>

  <!-- FEATURED / PRODUCTS -->
  <section class="py-12 md:py-16 sr" style="background:var(--bg-secondary);">
   <div class="px-6 md:px-16 max-w-[1440px] mx-auto mb-10 flex items-end justify-between">
    <div>
     <p id="featured-eyebrow" class="text-[9px] tracking-[0.5em] uppercase mb-2 text-[#C9A84C]"></p>
     <h2 id="featured-heading" class="font-display text-2xl md:text-4xl"></h2>
    </div>
   </div>
   <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-6 md:px-16 max-w-[1440px] mx-auto"></div>
  </section>

  <!-- NEWSLETTER -->
  <section class="py-16 md:py-20 sr text-center" style="background:var(--bg-tertiary);">
   <div class="max-w-xl mx-auto px-6">
    <h2 id="newsletter-heading" class="font-display text-2xl md:text-3xl mb-4"></h2>
    <p id="newsletter-sub" class="text-sm mb-10 text-[var(--text-secondary)]"></p>
    <form id="newsletter-form" class="flex gap-2" onsubmit="event.preventDefault(); alert('تم الانضمام بنجاح.');">
     <input type="email" id="newsletter-input" class="flex-1 px-5 py-3.5 text-sm gold-border bg-transparent outline-none" placeholder="البريد الإلكتروني..." required style="color:var(--text-primary);">
     <button type="submit" id="newsletter-btn" class="px-6 py-3.5 text-[9px] tracking-[0.25em] uppercase font-medium bg-[#C9A84C] text-[#080808]">انضمام</button>
    </form>
   </div>
  </section>

  <!-- FOOTER -->
  <footer class="py-20" style="border-top:1px solid var(--border);">
   <div class="max-w-[1440px] mx-auto px-6 md:px-16 grid md:grid-cols-4 gap-12">
    <div>
     <p id="footer-brand" class="font-display text-base tracking-[0.5em] uppercase mb-5" style="color:var(--accent);">LUXE</p>
     <p id="footer-desc" class="text-xs leading-[1.9] text-[var(--text-secondary)]"></p>
    </div>
    <div>
     <p id="footer-col2-title" class="text-[9px] tracking-[0.3em] uppercase font-medium mb-5 text-[#C9A84C]">الأقسام</p>
     <div id="footer-categories" class="flex flex-col gap-2.5 text-xs text-[var(--text-muted)]"></div>
    </div>
    <div>
     <p id="footer-col3-title" class="text-[9px] tracking-[0.3em] uppercase font-medium mb-5 text-[#C9A84C]">خدمة العملاء</p>
     <div class="flex flex-col gap-2.5 text-xs text-[var(--text-muted)]">
      <span class="cursor-pointer hover:underline">من نحن</span>
      <span class="cursor-pointer hover:underline">تواصل معنا</span>
      <span class="cursor-pointer hover:underline">سياسة الشحن</span>
     </div>
    </div>
    <div>
     <p id="footer-col4-title" class="text-[9px] tracking-[0.3em] uppercase font-medium mb-5 text-[#C9A84C]">تواصل واتساب</p>
     <p id="footer-whatsapp" class="text-xs text-[var(--text-secondary)]"></p>
    </div>
   </div>
   <div class="max-w-[1440px] mx-auto px-6 md:px-16 mt-14 pt-6 text-center border-t" style="border-color:var(--border);">
    <p id="footer-copy" onclick="openAdminPanel()" class="text-[8px] tracking-[0.4em] uppercase cursor-pointer select-none text-[var(--text-muted)]">جميع الحقوق محفوظة © 2026 LUXE</p>
   </div>
  </footer>

  <!-- CART DRAWER -->
  <div id="cart-drawer" class="fixed inset-0 z-[100] pointer-events-none hidden">
   <div id="cart-overlay" onclick="toggleCartDrawer()" class="absolute inset-0 bg-black/70 opacity-0 drawer-overlay pointer-events-auto"></div>
   <aside id="cart-panel" class="absolute top-0 end-0 h-full w-full max-w-sm pointer-events-auto drawer-panel flex flex-col shadow-2xl" style="background:var(--bg-primary);transform:translateX(100%);border-inline-start:1px solid var(--border);">
    <div class="flex items-center justify-between p-5 border-b" style="border-color:var(--border);">
     <h3 id="cart-title" class="font-display text-base">حقيبة التسوق</h3>
     <button onclick="toggleCartDrawer()" aria-label="Close"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
    <div class="p-5 border-t" style="border-color:var(--border);">
     <div class="mb-3 flex items-center gap-2">
      <input type="text" id="coupon-input" placeholder="كود الخصم (Coupon)" class="admin-input flex-1">
      <button onclick="applyCoupon()" class="admin-btn">تطبيق</button>
     </div>
     <div class="flex justify-between mb-4 font-bold text-sm">
      <span id="cart-total-label">الإجمالي:</span>
      <span id="cart-total-price" class="text-[#C9A84C]">$0</span>
     </div>
     <button onclick="checkoutWhatsApp()" class="w-full py-3.5 bg-[#C9A84C] text-[#080808] text-[10px] tracking-[0.25em] uppercase font-bold text-center">إتمام الطلب عبر واتساب</button>
    </div>
   </aside>
  </div>

  <!-- FAVORITES DRAWER -->
  <div id="fav-drawer" class="fixed inset-0 z-[100] pointer-events-none hidden">
   <div id="fav-overlay" onclick="toggleFavDrawer()" class="absolute inset-0 bg-black/70 pointer-events-auto"></div>
   <aside id="fav-panel" class="absolute top-0 start-0 h-full w-full max-w-sm pointer-events-auto drawer-panel flex flex-col shadow-2xl" style="background:var(--bg-primary);transform:translateX(-100%);border-inline-end:1px solid var(--border);">
    <div class="flex items-center justify-between p-5 border-b" style="border-color:var(--border);">
     <h3 id="fav-title" class="font-display text-base">المفضلة</h3>
     <button onclick="toggleFavDrawer()" aria-label="Close"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="fav-items" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
   </aside>
  </div>

  <!-- SEARCH MODAL -->
  <div id="search-modal" class="fixed inset-0 z-[150] bg-black/95 hidden flex flex-col p-6 md:p-16">
   <div class="max-w-3xl mx-auto w-full">
    <div class="flex justify-between items-center mb-10 border-b pb-4" style="border-color:var(--accent);">
     <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="ابحث عن منتج..." class="w-full bg-transparent text-xl md:text-3xl outline-none border-none text-[var(--text-primary)]">
     <button onclick="closeSearchModal()" class="text-2xl text-[var(--text-primary)]">✕</button>
    </div>
    <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto"></div>
   </div>
  </div>

  <!-- ADMIN PANEL (FULL CATEGORY-BASED REVIEWS & MANAGEMENT) -->
  <div id="admin-panel" class="admin-overlay">
   <div class="max-w-6xl mx-auto p-6 md:p-12">
    <div class="flex justify-between items-center pb-6 mb-8 border-b" style="border-color:var(--border);">
     <div class="flex items-center gap-3">
      <i data-lucide="settings" class="w-6 h-6 text-[#C9A84C]"></i>
      <h2 class="font-display text-2xl text-[#C9A84C]">لوحة التحكم المتقدمة (Admin Panel)</h2>
     </div>
     <button onclick="closeAdminPanel()" class="admin-btn admin-btn-outline">إغلاق لوحة التحكم</button>
    </div>

    <!-- Admin Tabs -->
    <div class="flex gap-2 overflow-x-auto mb-8 border-b" style="border-color:var(--border);">
     <button class="admin-tab active" onclick="switchAdminTab('products', this)">إدارة المنتجات</button>
     <button class="admin-tab" onclick="switchAdminTab('categories', this)">الأقسام</button>
     <button class="admin-tab" onclick="switchAdminTab('orders', this)">طلبات الزوار والعملاء</button>
     <button class="admin-tab" onclick="switchAdminTab('analytics', this)">التحليلات والإيرادات</button>
     <button class="admin-tab" onclick="switchAdminTab('coupons', this)">الكوبونات</button>
     <button class="admin-tab" onclick="switchAdminTab('settings', this)">إعدادات المتجر</button>
     <button class="admin-tab" onclick="switchAdminTab('data', this)">البيانات (استيراد/تصدير)</button>
    </div>

    <!-- TAB 1: PRODUCTS (Organized by Category) -->
    <div id="tab-products" class="admin-tab-content">
     <div class="flex justify-between items-center mb-6">
      <h3 class="text-xs tracking-widest uppercase text-[#C9A84C] font-bold">المنتجات حسب الأقسام</h3>
      <button onclick="openProductModal()" class="admin-btn">+ إضافة منتج جديد</button>
     </div>
     <div id="admin-products-container" class="space-y-6"></div>
    </div>

    <!-- TAB 2: CATEGORIES -->
    <div id="tab-categories" class="admin-tab-content hidden">
     <div class="flex justify-between items-center mb-6">
      <h3 class="text-xs tracking-widest uppercase text-[#C9A84C] font-bold">إدارة الأقسام</h3>
      <button onclick="addCategoryPrompt()" class="admin-btn">+ إضافة قسم جديد</button>
     </div>
     <div id="admin-categories-list" class="space-y-3"></div>
    </div>

    <!-- TAB 3: ORDERS (Category-based Review & Confirmation Workflow) -->
    <div id="tab-orders" class="admin-tab-content hidden">
     <h3 class="text-xs tracking-widest uppercase text-[#C9A84C] font-bold mb-4">طلبات الواتساب (مراجعة
